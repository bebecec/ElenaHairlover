<!DOCTYPE html>
<html lang="es">
<head>
    <script>
      // Redirección automática si la agenda configurada NO es Firebase
      try {
        var config = JSON.parse(localStorage.getItem("elegance_agenda_config"));
        if (config && config.type !== "firebase") {
          var redirectUrl = "";
          if (config.type === "external" && config.externalUrl) redirectUrl = config.externalUrl;
          else if (config.type === "internal" && config.internalUrl) redirectUrl = config.internalUrl;
          else if (config.type === "google" && config.googleUrl) redirectUrl = config.googleUrl;
          
          if (redirectUrl) {
            window.location.href = redirectUrl;
          }
        }
      } catch(e) {}
    </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservar Cita | Elena Hairlover</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .time-slot {
      padding: 10px;
      border: 1px solid #C9A84C;
      text-align: center;
      cursor: pointer;
      color: #fff;
      transition: all 0.3s;
    }
    .time-slot:hover:not(.disabled) {
      background: #C9A84C;
      color: #111;
    }
    .time-slot.selected {
      background: #C9A84C;
      color: #111;
    }
    .time-slot.disabled {
      border-color: #444;
      color: #666;
      background: #222;
      cursor: not-allowed;
    }
  </style>
</head>
<body class="bg-[#111111] text-white font-sans">
  <header class="p-6 border-b border-white/10 flex justify-between items-center">
    <a href="index.html" class="text-gold-warm uppercase tracking-widest font-bold">Elena Hairlover</a>
    <a href="index.html" class="text-white/60 hover:text-white">Volver</a>
  </header>

  <main class="max-w-3xl mx-auto p-6 mt-10">
    <h1 class="text-3xl font-serif text-gold-warm mb-8 text-center">Reserva tu Cita</h1>

    <!-- ES: Contenedor de la lista de servicios | EN: Services list container -->
    <div id="services-container" class="space-y-4">
      <div class="text-center py-10 text-white/50">Cargando servicios...</div>
    </div>

    <!-- ES: Mensaje de Éxito | EN: Success Message -->
    <div id="success-msg" style="display:none;" class="text-center py-20">
      <h2 class="text-2xl text-green-400 mb-4">¡Reserva Confirmada!</h2>
      <p>Te esperamos el <span id="conf-date"></span> a las <span id="conf-time"></span> para tu <span id="conf-service"></span>.</p>
      <a href="index.html" class="inline-block mt-6 border border-gold-warm text-gold-warm px-6 py-2 rounded">Volver al Inicio</a>
    </div>

  </main>

  <!-- ES: Modal del Calendario | EN: Calendar Modal -->
  <div id="booking-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300 p-4">
    <div class="bg-[#FAF8F5] rounded-xl w-full max-w-lg mx-auto max-h-[90vh] flex flex-col overflow-hidden relative shadow-2xl">
      
      <!-- Close button -->
      <button id="close-modal" class="absolute top-4 right-4 text-gray-500 hover:text-black text-2xl leading-none z-10">&times;</button>
      
      <!-- Header -->
      <div class="p-4 border-b border-gray-200 text-center relative">
        <h3 class="text-gray-800 font-medium text-lg">Elige día y hora</h3>
        <span class="text-[#C9A84C] text-xs font-bold uppercase tracking-widest block mt-1">CUANDO</span>
      </div>
      
      <!-- Scrollable content -->
      <div class="p-6 overflow-y-auto flex-1 custom-scrollbar">
        <!-- Calendar Section -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-6" style="transform: scale(0.8); transform-origin: top; margin-bottom: -40px;">
          <div class="flex justify-between items-center bg-[#C9A84C] text-white rounded-t-lg -mx-4 -mt-4 p-3 mb-4">
            <button id="prev-month" class="hover:bg-white/20 px-2 py-1 rounded transition-colors">&lt;</button>
            <div id="current-month" class="font-bold tracking-wide"></div>
            <button id="next-month" class="hover:bg-white/20 px-2 py-1 rounded transition-colors">&gt;</button>
          </div>
          
          <div class="grid grid-cols-7 gap-1 text-center text-xs text-gray-500 mb-2 font-bold">
            <div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div>
          </div>
          <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center text-sm font-medium text-gray-700">
            <!-- Calendar days will be injected here -->
          </div>
        </div>

        <!-- Time Slots Section -->
        <div>
          <h4 class="text-gray-800 font-bold mb-4 text-sm text-center">Horas recomendadas por el centro</h4>
          <div id="time-slots" class="flex flex-wrap justify-center gap-3">
            <div class="text-gray-400 text-sm py-2 w-full text-center">Selecciona un día en el calendario</div>
          </div>
        </div>
        
        <div class="text-center mt-6">
          <button class="bg-[#C9A84C]/20 text-[#C9A84C] px-4 py-2 rounded font-medium text-sm hover:bg-[#C9A84C]/30 transition-colors">Ver más disponibilidad</button>
        </div>
      </div>

        <!-- Footer / Confirmation -->
        <div class="p-3 bg-white border-t border-gray-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
          <div class="flex justify-between items-center mb-2">
            <div>
              <div id="modal-service-name" class="font-bold text-gray-800 text-sm"></div>
            </div>
            <div class="text-right">
              <span id="modal-price" class="text-[#C9A84C] text-sm font-bold block"></span>
              <span id="modal-duration" class="text-gray-500 text-xs"></span>
            </div>
          </div>
          
          <div class="flex items-center justify-between">
            <div class="font-bold text-gray-800 text-sm">
              Total: <span id="modal-total" class="text-black"></span>
            </div>
            <button id="btn-confirmar" class="bg-[#111] hover:bg-[#222] text-white font-bold py-2 px-6 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
              Confirmar
            </button>
          </div>
        </div>
    </div>
  </div>

  <!-- FIREBASE SCRIPTS -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  
  <script src="js/config.js"></script>
  <script>
    if (window.useFirebase) {
      firebase.initializeApp(window.firebaseConfig);
    }
  </script>
  <script src="js/reservar.js"></script>
</body>
</html>
